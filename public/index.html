<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mandado — Tu agente negocia. PayPal retiene. Tú decides.</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-view="create">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <span class="logo">Mandado</span>
      <ol class="stepper" id="stepper" aria-label="Progreso">
        <li data-step="1"><span class="dot">1</span><span class="lbl">Pide</span></li>
        <li data-step="2"><span class="dot">2</span><span class="lbl">Negocia</span></li>
        <li data-step="3"><span class="dot">3</span><span class="lbl">Decide</span></li>
      </ol>
    </div>
  </header>
  <main class="wrap" id="app"></main>
  <script src="/app.js" defer></script>
</body>
</html>
